<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boxo onrender</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      
      background-color: rgb(29, 32, 31);
      min-height: 100vh;
      padding: 24px 16px 48px;
      color: white;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      color: white;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #475569;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
        max-width: 420px;
      }
    }

    .item {
      position: relative;
      display: block;
     
      overflow: hidden;
      aspect-ratio: 4 / 3;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.15),
                  0 4px 10px -4px rgba(15, 23, 42, 0.1);
      text-decoration: none;
      color: white;
      background: #cbd5e1;
    }
    
    .item img {
      width: 100%;
      height: 100%;
      object-fit: stretch;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(29, 32, 31, 0.85) 0%, rgba(29, 32, 31, 0.85) 50%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      opacity: 0;
      transition: opacity;
    }

    .item:hover .overlay {
      opacity: 1;
    }

    .overlay h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .overlay p {
      font-size: 0.9rem;
      opacity: 0.9;
      line-height: 1.4;
    }


    @media (hover: none) {
      .overlay {
        opacity: 1;
        background: linear-gradient(to top, rgba(29, 32, 31, 0.75) 0%, transparent 60%);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>boxo onrender</h1>
  </header>

  <div class="grid">
    
    <a class="item" href="https://jtportal.onrender.com" target="_blank" rel="noopener noreferrer">
      <img src="https://waxstatic.onrender.com/jtportal.png">
      <div class="overlay">
        <h2>jt portal</h2>
        <p>the classic</p>
      </div>
    </a>


    <a class="item" href="https://toktimer.onrender.com" target="_blank" rel="noopener noreferrer">
      <img src="https://waxstatic.onrender.com/toktimer2.webp">
      <div class="overlay">
        <h2>toktimer</h2>
        <p>probably broken</p>
      </div>
    </a>


    <a class="item" href="https://econbymistake.onrender.com" target="_blank" rel="noopener noreferrer">
      <img src="https://waxstatic.onrender.com/econbymistake.png">
      <div class="overlay">
        <h2>economicsbymistake</h2>
        <p>every hsc and select prelim multiple choice questions for economics</p>
      </div>
    </a>

    <a class="item" href="https://boomvstrough.onrender.com" target="_blank" rel="noopener noreferrer">
      <img src="https://waxstatic.onrender.com/boomvstrough.jpg">
      <div class="overlay">
        <h2>boom vs trough</h2>
        <p>the excel spreadsheet, now on a website</p>
      </div>
    </a>

    <a class="item" href="https://boxo.onrender.com" target="_blank" rel="noopener noreferrer">
      <img src="https://waxstatic.onrender.com/malaysia_low_quality.png">
      <div class="overlay">
        <h2>placholder</h2>
        <p>malaysia_low_quality.png</p>
      </div>
    </a>

    <a class="item" href="https://boxo.onrender.com" target="_blank" rel="noopener noreferrer">
      <img src="https://waxstatic.onrender.com/malaysia_low_quality.png">
      <div class="overlay">
        <h2>placholder</h2>
        <p>malaysia_low_quality.png</p>
      </div>
    </a>



  </div>
</body>
</html>
